[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jobcrawl"
version = "0.1.0.dev0"
description = "Crawl public job boards for any field, classify the roles, embed them and explore them in the browser."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
embed = ["numpy", "onnxruntime", "tokenizers", "onnx"]
map = ["numpy", "scipy", "umap-learn", "leidenalg", "igraph"]

[project.scripts]
jobcrawl = "jobcrawl.cli:main"

[tool.setuptools.packages.find]
include = ["jobcrawl*"]
