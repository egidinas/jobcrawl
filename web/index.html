<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Jobs</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<a class="skip" href="#main" data-de="Zum Inhalt springen">Skip to content</a>
<header class="site-header" id="site-header"></header>
<main id="main" class="wrap">
  <h1 data-de="Offene Stellen">Open roles</h1>
  <p class="lead" data-de="Öffentliche Stellen aus den Jobbörsen dieses Datenordners. Suche und Filter laufen auf diesem Gerät.">Public roles from the job boards in this data folder. Search and filters run on this device.</p>
  <form id="filters" class="filters" role="search">
    <label class="grow"><span data-de="Suche">Search</span>
      <input id="q" type="search" autocomplete="off" placeholder="e.g. thermal, software, testing" data-de-placeholder="z. B. Thermal, Software, Testing"></label>
    <label><span data-de="Region">Region</span><select id="f-scope"></select></label>
    <label><span data-de="Fachgebiet">Field</span><select id="f-field"></select></label>
    <label><span data-de="Level">Level</span><select id="f-level"></select></label>
  </form>
  <p class="status" id="status" aria-live="polite"></p>
  <ol class="roles" id="results"></ol>
  <nav class="pager" id="pager" aria-label="Pages"></nav>
  <p class="small muted" id="match-link"></p>
</main>

<aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="d-title" hidden>
  <div class="drawer-head"><button type="button" class="button outline small-btn" id="d-close" data-de="Schließen">Close</button></div>
  <div id="d-body"></div>
</aside>

<footer class="site-footer" id="site-footer"></footer>

<script type="module">
import { boot, dataUrl, pageUrl, roleLink, defaultScope, L, esc, pick, labelText } from './assets/app.js';
import { loadIndex, bm25 } from './assets/match.js';

const cfg = await boot('index');
const $ = (id) => document.getElementById(id);
const PAGE = 50;
const st = { ix: null, rows: null, byId: new Map(), list: [], page: 0, scope: 0, field: '', level: 0, open: null };
const fieldName = (id) => { const f = cfg.fields.find((x) => x.id === id); return f ? labelText(f.label) : id; };
const levelName = (code) => { const b = cfg.levels.find((x) => x.code === code); return b ? labelText(b.label) : ''; };
const matchLink = $('match-link');
matchLink.innerHTML = `<a href="${pageUrl('match.html')}">${L('Find roles that match my CV →', 'Stellen finden, die zu meinem CV passen →')}</a>`;

async function start() {
  try {
    const [ix, rows] = await Promise.all([loadIndex(dataUrl('match/'), cfg.glossary), fetch(dataUrl('jobs-index.json')).then((r) => { if (!r.ok) throw new Error('jobs-index.json ' + r.status); return r.json(); })]);
    st.ix = ix; st.rows = rows; st.byId = new Map(rows.map((r, i) => [r[0], i]));
  } catch (e) {
    $('status').textContent = pick(`The role list could not be loaded (${e.message}). Run jobcrawl build and jobcrawl publish, or check ?data=.`, `Die Stellenliste konnte nicht geladen werden (${e.message}). jobcrawl build und jobcrawl publish ausführen oder ?data= prüfen.`);
    return;
  }
  const ix = st.ix;
  $('f-scope').innerHTML = cfg.scopes.map((s, k) => `<option value="${k}">${esc(pick(s.label.en, s.label.de))}</option>`).join('');
  st.scope = defaultScope(); $('f-scope').value = String(st.scope);
  $('f-field').innerHTML = `<option value="">${esc(pick('All fields', 'Alle Fachgebiete'))}</option>` + ix.fields.map((f) => `<option value="${esc(f)}">${esc(fieldName(f))}</option>`).join('');
  $('f-level').innerHTML = `<option value="0">${esc(pick('All levels', 'Alle Level'))}</option>` + ix.levels.map((code, k) => (k ? `<option value="${k}">${esc(levelName(code))}</option>` : '')).join('');
  run();
  fromHash();
}

const matches = (i) => {
  const a = st.ix.attrs[i];
  if (!((a[0] >> st.scope) & 1)) return false;
  if (st.level && a[1] !== st.level) return false;
  if (st.field && !((a[4] >> st.ix.fields.indexOf(st.field)) & 1)) return false;
  return true;
};

function run() {
  const q = $('q').value.trim(), n = st.ix.n;
  const order = [];
  if (q) {
    const b = bm25(st.ix, q, 60);
    for (let i = 0; i < n; i++) if (b.score[i] > 0 && matches(i)) order.push([b.score[i], i]);
    order.sort((x, y) => y[0] - x[0] || x[1] - y[1]);
    st.list = order.map((x) => x[1]);
  } else {
    st.list = [];
    for (let i = 0; i < n; i++) if (matches(i)) st.list.push(i);
  }
  st.page = 0;
  render();
}

function render() {
  const n = st.list.length, pages = Math.max(1, Math.ceil(n / PAGE));
  st.page = Math.min(st.page, pages - 1);
  const slice = st.list.slice(st.page * PAGE, st.page * PAGE + PAGE);
  $('status').textContent = n
    ? pick(`${n.toLocaleString('en-US')} role${n === 1 ? '' : 's'}`, `${n.toLocaleString('de-DE')} Stellen`) + (n > PAGE ? pick(`, showing ${st.page * PAGE + 1}–${st.page * PAGE + slice.length}`, `, gezeigt ${st.page * PAGE + 1}–${st.page * PAGE + slice.length}`) : '')
    : pick('No roles match. Try another region or fewer words.', 'Keine Stellen gefunden. Andere Region oder weniger Suchwörter probieren.');
  $('results').innerHTML = slice.map((i) => {
    const r = st.rows[i], a = st.ix.attrs[i], region = st.ix.regions[a[3]] || '', lv = a[1] ? levelName(st.ix.levels[a[1]]) : '';
    return `<li class="role"><a class="role-title" href="${roleLink(r[0])}">${esc(r[1])}</a><div class="role-meta">${esc(r[2])}${region ? ' · ' + esc(region) : ''}${lv ? ' · ' + esc(lv) : ''}</div></li>`;
  }).join('');
  $('pager').innerHTML = pages > 1 ? `<button type="button" id="p-prev" ${st.page === 0 ? 'disabled' : ''}>${esc(pick('Previous', 'Zurück'))}</button><span>${esc(pick('Page', 'Seite'))} ${st.page + 1} / ${pages}</span><button type="button" id="p-next" ${st.page >= pages - 1 ? 'disabled' : ''}>${esc(pick('Next', 'Weiter'))}</button>` : '';
}

async function openRole(id) {
  const i = st.byId.get(id);
  if (i === undefined) { closeDrawer(false); return; }
  st.open = id;
  $('drawer').hidden = false;
  $('d-body').innerHTML = `<p class="muted">${esc(pick('Loading …', 'Lade …'))}</p>`;
  const shard = await fetch(dataUrl('jobs-desc-' + id.slice(0, 2) + '.json')).then((r) => (r.ok ? r.json() : {})).catch(() => ({}));
  if (st.open !== id) return;
  const d = shard[id] || {}, r = st.rows[i], a = st.ix.attrs[i], ix = st.ix;
  const region = ix.regions[a[3]] || '', lv = a[1] ? levelName(ix.levels[a[1]]) : '';
  const facts = [d.l, region, lv, (d.tg || []).map(fieldName).join(' · '), d.d && pick('listed ', 'gelistet ') + d.d].filter(Boolean);
  const text = (d.x || '').replace(/\n{3,}/g, '\n\n').trim();
  const dups = ix.dupsOf(i).slice(0, 4), nb = ix.nbOf(i).slice(0, 6);
  $('d-body').innerHTML = `<h2 id="d-title">${esc(r[1])}</h2>
<p class="role-meta">${esc(r[2])}</p>
<div class="facts">${facts.map((f) => `<span>${esc(f)}</span>`).join('')}</div>
<p><a class="button small-btn" href="${esc(r[3])}" target="_blank" rel="noopener">${esc(pick('Apply on the employer site ↗', 'Beim Arbeitgeber bewerben ↗'))}</a></p>
${text ? `<div class="txt" tabindex="0">${esc(text)}</div>` : `<p class="muted">${esc(pick('No description was saved for this role; only the title is known.', 'Für diese Stelle wurde keine Beschreibung gespeichert; bekannt ist nur der Titel.'))}</p>`}
${dups.length ? `<p class="small">${esc(pick('Also listed', 'Noch ausgeschrieben'))}: ${dups.map((j) => `<a href="${esc(st.rows[j][3])}" target="_blank" rel="noopener">${esc(st.rows[j][2])}${ix.regions[ix.attrs[j][3]] ? ' · ' + esc(ix.regions[ix.attrs[j][3]]) : ''}</a>`).join(', ')}</p>` : ''}
${nb.length ? `<h3>${esc(pick('Similar roles', 'Ähnliche Stellen'))}</h3><ul class="similar">${nb.map((x) => `<li><a href="${roleLink(st.rows[x.i][0])}">${esc(st.rows[x.i][1])}</a> <span class="muted">${esc(st.rows[x.i][2])}</span></li>`).join('')}</ul>` : ''}`;
  $('d-close').focus();
}

function closeDrawer(clearHash = true) {
  st.open = null;
  $('drawer').hidden = true;
  if (clearHash && location.hash) history.replaceState(null, '', location.pathname + location.search);
}

function fromHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id && st.byId.has(id)) openRole(id);
  else if (!id && st.open) closeDrawer(false);
}

$('filters').addEventListener('submit', (e) => { e.preventDefault(); run(); });
let timer = 0;
$('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(run, 120); });
$('f-scope').addEventListener('change', (e) => { st.scope = +e.target.value; run(); });
$('f-field').addEventListener('change', (e) => { st.field = e.target.value; run(); });
$('f-level').addEventListener('change', (e) => { st.level = +e.target.value; run(); });
$('pager').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  st.page += b.id === 'p-next' ? 1 : -1; render(); $('results').scrollIntoView({ block: 'start' });
});
$('d-close').addEventListener('click', () => closeDrawer());
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && st.open) closeDrawer(); });
window.addEventListener('hashchange', fromHash);

start();
</script>
</body>
</html>
