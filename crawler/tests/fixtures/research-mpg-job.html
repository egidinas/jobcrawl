    {"@context":"https://schema.org/","@type":"JobPosting","title":"Scientist/Engineer (m/f/d) in Automated Biology\u003cbr\u003e ","description":"\u003cp\u003eThe newly established Automated Biology Facility develops automated experimental workflows for the institute’s research groups and core facilities. Combining experimental biology with laboratory robotics, software development, and data acquisition, we transform biological protocols into robust, reproducible systems. Our projects range from routine liquid handling to complex experimental pipelines, integrating existing laboratory instruments and developing custom devices for tasks such as sample preparation, dissection, and quantitative imaging. We aim to generate well-characterised quantitative datasets and link automated experiments with physical models, enabling closed-loop workflows in which measurements inform models and model predictions guide subsequent experiments.\u003c/p\u003e\u003ch2\u003eYour role\u003c/h2\u003e\u003cp\u003eWithin this framework, you will translate biological protocols into reliable, reproducible automated workflows for research groups across MPI-CBG. Combining hands-on laboratory work, robotics, and software development, you will take projects from initial feasibility assessment to validated systems ready for routine use. Your tasks will include:\u003c/p\u003e\u003cul\u003e\n\u003cli\u003eWorking with research groups to define scientific goals, biological constraints, technical requirements, and criteria for success.\u003c/li\u003e\n\u003cli\u003eIndependently planning and managing projects, assessing feasibility, setting milestones, and communicating progress and resource needs.\u003c/li\u003e\n\u003cli\u003eDeveloping and refining automated experimental methods, from sample preparation and liquid handling to experimental execution and data acquisition.\u003c/li\u003e\n\u003cli\u003eIntegrating laboratory instruments and robotic systems for reliable operation across experimental procedures.\u003c/li\u003e\n\u003cli\u003eDeveloping, testing, and maintaining software for instrument control, experimental processes, and data processing, using version control and well-documented code.\u003c/li\u003e\n\u003cli\u003eValidating and benchmarking new methods with biological controls, assessing sample quality, reproducibility, throughput, and robustness.\u003c/li\u003e\n\u003cli\u003eMaintaining and improving established systems through troubleshooting, calibration, cleaning, servicing, and recovery after interruptions.\u003c/li\u003e\n\u003cli\u003eDocumenting protocols, equipment configurations, and experimental data, including metadata and execution logs, and training colleagues to use validated methods.\u003c/li\u003e\n\u003cli\u003eContributing to the presentation and publication of developed methods and results.\u003c/li\u003e\n\u003c/ul\u003e\u003ch2\u003eYour profile\u003c/h2\u003e\u003cul\u003e\n\u003cli\u003ePreferably PhD degree in biology, biotechnology, bioengineering, automation engineering, robotics, or a related field. Candidates with a Master’s degree (MSc/MEng), or Diplom-Ingenieur qualification are also welcome to apply.\u003c/li\u003e\n\u003cli\u003eStrong practical understanding of biological experiments and experience developing, adapting, or validating laboratory protocols.\u003c/li\u003e\n\u003cli\u003eStrong programming skills, preferably in Python, with the ability to develop reliable and maintainable scientific software.\u003c/li\u003e\n\u003cli\u003eExperience planning and implementing scientific or technical development projects, including systematic testing and troubleshooting.\u003c/li\u003e\n\u003cli\u003eExcellent English communication skills and the ability to collaborate across disciplines.\u003c/li\u003e\n\u003cli\u003eExperience with liquid-handling platforms, laboratory robotics, instrument integration, or automated experimental workflows is advantageous.\u003c/li\u003e\n\u003cli\u003eFamiliarity with experimental data and metadata systems, or an interest in physical modelling, AI-assisted experimental design, and closed-loop experimentation, would be a plus.\u003c/li\u003e\n\u003c/ul\u003e\u003ch2\u003eOur offer\u003c/h2\u003e\u003cul\u003e\n\u003cli\u003eAn opportunity to help establish a new scientific facility at the interface of experimental biology, robotics, and software engineering.\u003c/li\u003e\n\u003cli\u003eA full-time position, with an initial 2-year contract and the possibility of an extension for up to three additional years.\u003c/li\u003e\n\u003cli\u003eSalary and benefits in accordance with the German public-sector collective agreement (TVöD Bund), up to EG13.\u003c/li\u003e\n\u003cli\u003ePublic-sector benefits including 31 days of annual leave, full social coverage, and supplementary pension (VBL).\u003c/li\u003e\n\u003cli\u003eA discounted public-transport job ticket (VVO) and excellent transport connections.\u003c/li\u003e\n\u003cli\u003eSupport for work-life balance, including assistance with family and childcare matters.\u003c/li\u003e\n\u003cli\u003eA broad network for career development and training through the Max Planck Society.\u003c/li\u003e\n\u003c/ul\u003e\u003ch2\u003eYour application\u003c/h2\u003e\u003cp\u003ePlease apply through our \u003ca href=\"https://careers.mpi-cbg.de/jobs/68432988/Scientist-Engineer-m-f-d-in-Automated-Biology/\" target=\"_blank\"\u003eonline application system\u003c/a\u003e by \u003cstrong\u003e20 November 2026\u003c/strong\u003e, stating code 2026-Postdoc-Automation-1132\u003c/p\u003e\u003cp\u003ePlease include:\u003c/p\u003e\u003cul\u003e\n\u003cli\u003eA CV, including relevant publications and/or examples of technical or software projects.\u003c/li\u003e\n\u003cli\u003eA brief cover letter describing your motivation and experience in experimental method development, laboratory automation, or scientific software.\u003c/li\u003e\n\u003cli\u003eContact details for at least two referees.\u003c/li\u003e\n\u003c/ul\u003e\u003cp\u003eScientific inquiries may be addressed to Lars Hubatsch (\u003ca\u003ehubatsch@mpi-cbg.de\u003c/a\u003e), Automated Biology Facility. For questions about the contract, compensation, or benefits, please contact Human Resources (\u003ca href=\"https://hr@mpi-cbg.de\"\u003ehr@mpi-cbg.de\u003c/a\u003e).\u003c/p\u003e\u003cp\u003eMax Planck Institute of Molecular Cell Biology and Genetics\u003cbr\u003ePfotenhauerstr. 108, 01307 Dresden, Germany\u003cbr\u003ewww.mpi-cbg.de\u003c/p\u003e\u003cp\u003e\u003cem\u003eThe Max Planck Society strives for gender equality and diversity. We welcome applications from all backgrounds, regardless of gender, nationality, ethnicity, sexual orientation, religion, age, and other components of identity.\u003c/em\u003e\u003c/p\u003e\u003cul\u003e\n\u003cli\u003e\u003cem\u003eThe Max Planck Society specifically aims to increase the proportion of women in the areas in which they are underrepresented. We therefore explicitly invite women to apply.\u003c/em\u003e\u003c/li\u003e\n\u003cli\u003e\u003cem\u003eThe Max Planck Society is further committed to increasing the number of individuals with disabilities in its workforce and therefore encourages applications from such qualified individuals.\u003c/em\u003e\u003c/li\u003e\n\u003cli\u003e\u003cem\u003eThe Max Planck Society supports the compatibility of family and career and is certified according to the \"berufundfamilie\" (\"job and family\") audit.\u003c/em\u003e\u003c/li\u003e\n\u003cli\u003e\n\u003cem\u003eWhen you submit a job application to MPI-CBG, you are transmitting personal data. Please refer to our privacy notice for information on how we collect and process personal data in accordance with Art. 13 of the Datenschutz-Grundverordnung. By submitting your application you confirm that you have taken note of the information in our privacy notice.\u003c/em\u003e\u003cbr\u003e \u003c/li\u003e\n\u003c/ul\u003e","datePosted":"2026-10-29","validThrough":"2026-11-20","identifier":{"@type":"PropertyValue","name":"Max Planck Institute of Molecular Cell Biology and Genetics","value":"2026-Postdoc-Automation-1132"},"hiringOrganization":{"@type":"Organization","name":"Max Planck Institute of Molecular Cell Biology and Genetics","sameAs":"https://www.mpi-cbg.de/","logo":"https://www.mpg.de/assets/og-logo-281c44f14f2114ed3fe50e666618ff96341055a2f8ce31aa0fd70471a30ca9ed.jpg"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","streetAddress":"Pfotenhauerstr. 108","addressLocality":"Dresden","postalCode":"01307","addressCountry":"DE"}}}
