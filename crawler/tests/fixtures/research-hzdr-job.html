any pension scheme (VBL)</li>\r\n<li>Depending on the personal qualifications, the candidate may be classified in salary group 13 according to TVöD-Bund</li>\r\n<li>We support a good work-life balance with the possibility of part-time employment, mobile working and flexible working hours</li>\r\n<li>Numerous company health management offerings</li>\r\n<li>Employee discounts with well-known providers via the platform Corporate Benefits</li>\r\n<li>An employer subsidy for the \"Deutschland-Ticket Jobticket\"</li>\r\n</ul>\r\n<p>We look forward to receiving your application documents (including cover letter, CV, diplomas/transcripts, etc.), which you can submit via our online-application-system.  </p>\r\n",
