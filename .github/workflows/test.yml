name: test

on:
  push:
  pull_request:
  workflow_dispatch:

# read-only token; a newer push to the same branch cancels the older run
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# no network in the tests: they use the fixtures under crawler/tests and tests/, and local servers on 127.0.0.1
jobs:
  crawler:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Crawler tests (Node)
        run: node --test 'crawler/tests/*.test.mjs'

  pipeline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest supported Python (small routers still run it); the runner images no longer carry it,
        # so each version runs in the official Python image
        python-version: ['3.9', '3.12']
    container: python:${{ matrix.python-version }}-slim
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pipeline tests (Python)
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          python -m unittest discover tests
